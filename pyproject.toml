[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macos-selection-tts"
version = "0.1.0"
description = "Speak selected macOS text with local Kokoro or Chatterbox"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "kokoro==0.9.4",
  "numpy>=1.26",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
chatterbox = [
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
  "setuptools<81",
]

[project.scripts]
selection-tts-server = "macos_selection_tts.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_selection_tts"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
